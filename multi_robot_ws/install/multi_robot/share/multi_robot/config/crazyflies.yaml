# named list of all robots
fileversion: 3

robots:
  cfb1:
    enabled: false  
    uri: radio://0/80/2M/E7E7E7E7B1
    initial_position: [0.0, 0.0, 0.0]
    type: cf21  # see robot_types

  cfb2:
    enabled: false
    uri: radio://0/80/2M/E7E7E7E7B2
    initial_position: [0.0, 0.0, 0.0]
    type: cf21  # see robot_types

  cfb3:  # FIXED: Added proper indentation (2 spaces)
    enabled: true
    uri: radio://0/80/2M/E7E7E7E7B3
    initial_position: [0.0, -0.5, 0.0]
    type: cf21  # see robot_types

  cfb4:  # FIXED: Added proper indentation (2 spaces)
    enabled: true
    uri: radio://0/80/2M/E7E7E7B4  
    initial_position: [0.0, 0.5, 0.0]
    type: cf21  # see robot_types

  cfb5:  # FIXED: Added proper indentation (2 spaces)
    enabled: false
    uri: radio://0/80/2M/E7E7E7E7B5
    initial_position: [0.0, 0.5, 0.0]
    type: cf21  # see robot_types

# Definition of the various robot types
robot_types:  # FIXED: No indentation at top level
  cf21:
    motion_capture:
      tracking: "none"
      marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V

  cf21_mocap_deck:
    motion_capture:
      tracking: "none"
      marker: mocap_deck
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V

# global settings for all robots
all:
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10 # Hz
      status:
        frequency: 1 # Hz
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2 # 1: complementary, 2: kalman
      controller: 2 # 1: PID, 2: mellinger
    locSrv:
      extPosStdDev: 1e-3
      extQuatStdDev: 0.5e-1
  reference_frame: "world"
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1